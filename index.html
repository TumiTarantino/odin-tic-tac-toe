<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <form class="player-input-form">
        
        <label for="player-one">Player 1 (X)</label>
        <input type="text" id="player-one" name="player-one" placeholder="Enter player 1 name">

        <label for="player-two">Player 2 (O)</label>
        <input type="text" id="player-two" name="player-two" placeholder="Enter player 2 name">

        <button class="start-button">Start Game</button>
    </form>

    <div class="player-1-name"></div>
    <div class="player-2-name"></div>

    <div class="game-container"></div>
    <div class="game-result"></div>
</body>
</html>
