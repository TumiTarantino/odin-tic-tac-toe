<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <h1 class="centered">Tic Tac Toe</h1>
    <button class="modal-start-btn centered">Create Players</button>
    <button class="reset-game-btn centered">Reset Game</button>
    <dialog id="formModal">
        <form class="player-input-form centered">
            
            <label for="player-one">Player 1 (X)</label>
            <input type="text" id="player-one" name="player-one" placeholder="Enter player 1 name">

            <label for="player-two">Player 2 (O)</label>
            <input type="text" id="player-two" name="player-two" placeholder="Enter player 2 name">

            <button class="start-button">Start Game</button>
        </form>
    </dialog>

    <div class="player-1-name centered"></div>
    <div class="player-2-name centered"></div>
    <div class="active-player centered"></div>
    <div class="game-container"></div>
    <div class="game-result centered"></div>
</body>
</html>
